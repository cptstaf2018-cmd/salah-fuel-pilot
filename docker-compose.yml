services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fuel_user
      POSTGRES_PASSWORD: fuel_password
      POSTGRES_DB: salah_fuel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel_user -d salah_fuel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
